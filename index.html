<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Winter Quest: Custom Icons</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700&family=Ruslan+Display&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Nunito', sans-serif; background-color: #dff9fb; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        /* ПРЕЛОАДЕР */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50000;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: 'Fredoka', sans-serif; transition: opacity 0.5s;
        }
        .loader-spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30000; }
        .snowflake { position: absolute; top: -10px; color: #fff; opacity: 0.9; animation: fall linear infinite; text-shadow: 0 0 5px rgba(255,255,255,0.8); }
        @keyframes fall { to { transform: translateY(110vh); } }

        /* ЗАСТАВКА */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20000;
            background-image: url('img/splash_bg.jpg'); background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; overflow: hidden;
            transform-origin: center center; transition: opacity 1s ease-in, transform 1s ease-in; 
        }
        #splash-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 100%); pointer-events: none; z-index: 1; }
        .splash-ui-container { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6vh; transition: opacity 0.3s; }
        .splash-logo { width: 95%; max-width: 500px; height: auto; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4)); margin-bottom: 5px; animation: logoFloat 4s ease-in-out infinite; }
        @keyframes logoFloat { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .splash-subtitle { font-family: 'Ruslan Display', cursive; font-size: 26px; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,1); margin-bottom: 0; opacity: 1; }
        
        .splash-btn { background: linear-gradient(to bottom, #e74c3c, #c0392b); color: #fff; font-family: 'Fredoka', sans-serif; font-size: 26px; padding: 16px 70px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(231, 76, 60, 0.6), 0 6px 0 #96281b; text-transform: uppercase; letter-spacing: 2px; transition: transform 0.1s; animation: btnPulse 2s infinite; margin-top: auto; margin-bottom: 20px; }
        @keyframes btnPulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(231, 76, 60, 0.9), 0 6px 0 #96281b; } 100% { transform: scale(1); } }
        .splash-btn:active { transform: scale(0.95) !important; box-shadow: 0 0 10px rgba(231, 76, 60, 0.4), 0 2px 0 #96281b; }
        #splash-screen.thaw-effect { opacity: 0; transform: scale(2.5); pointer-events: none; }
        .ui-hidden { opacity: 0; pointer-events: none; }

        /* СОЦ ИКОНКИ */
        .social-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 15vh; }
        .social-icon-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.1s; text-decoration: none; border: 2px solid #fff; cursor: pointer; overflow: hidden; padding: 5px; box-sizing: border-box; }
        .social-icon-btn:active { transform: scale(0.9); }
        .social-icon-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
        /* Специальный класс для модалки, чтобы убрать отступ снизу */
        .modal-socials { margin-bottom: 0; margin-top: 15px; }

        /* ИНСТРУКЦИЯ */
        #intro-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 35, 50, 0.8); backdrop-filter: blur(8px); z-index: 25000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.5s; }
        #intro-modal.show { opacity: 1; }
        .intro-content { background-color: #FFFBF5; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23e0e0e0' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E"); padding: 20px; padding-top: 45px; width: 85%; max-width: 340px; text-align: center; border: 8px solid #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.1); animation: popUp 0.4s ease; }
        .intro-title { font-family: 'Ruslan Display', cursive; color: #2980b9; font-size: 28px; margin-bottom: 20px; }
        .intro-text { font-size: 16px; color: #2d3436; line-height: 1.5; margin-bottom: 15px; font-weight: 600; }
        .intro-highlight { color: #e74c3c; font-weight: 800; }
        .intro-btn { background: #0984e3; color: #fff; font-family: 'Fredoka', sans-serif; font-size: 20px; padding: 12px 40px; border: none; border-radius: 12px; width: 100%; box-shadow: 0 6px 0 #055fa5; cursor: pointer; margin-top: 10px; }
        .intro-btn:active { transform: translateY(6px); box-shadow: none; }
        .reset-link-btn { background: #ff7675; color: #fff; border: none; padding: 10px 25px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: bold; font-size: 15px; margin-top: 20px; cursor: pointer; display: inline-block; box-shadow: 0 4px 0 #d63031; transition: all 0.1s; }
        .reset-link-btn:active { transform: translateY(4px); box-shadow: none; }
        .reset-btn-small { margin-top:10px; background:#b2bec3; box-shadow:0 6px 0 #636e72; color:#fff; font-size:16px; padding: 10px; }

        /* UI ИГРЫ */
        #ui-header { position: absolute; top: -100px; left: 15px; right: 15px; height: 60px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); border: 2px solid #fff; border-radius: 20px; z-index: 100; pointer-events: none; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: top 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #ui-header.show { top: 15px; }
        #header-left-group { display: flex; align-items: center; pointer-events: auto; }
        #sound-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; margin-right: 8px; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.1s; }
        #sound-btn:active { transform: scale(0.9); }
        
        #timer-box { font-family: 'Fredoka', sans-serif; font-size: 20px; color: #2980b9; font-weight: bold; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 10px; }
        .timer-disabled { background: #dfe6e9 !important; color: #636e72 !important; border: 2px solid #b2bec3; }

        #certs-container { display: flex; gap: 8px; }
        .mini-cert { width: 30px; height: 30px; background-color: rgba(255,255,255,0.6); border-radius: 50%; border: 2px solid #fff; display: flex; justify-content: center; align-items: center; transition: all 0.4s; }
        .cert-img { width: 20px; height: 20px; background-image: url('img/cert.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.3; filter: grayscale(100%); transition: 0.5s; }
        .mini-cert.collected { background: #fff; box-shadow: 0 0 0 2px #ffd700; transform: scale(1.15); border-color: #fff; }
        .mini-cert.collected .cert-img { opacity: 1; filter: none; }

        /* КАРТА И ОБЪЕКТЫ */
        #game-map { position: relative; width: 100%; height: 100vh; max-width: 600px; margin: 0 auto; background-image: url('img/map2.png'); background-size: 100% 100%; background-position: center; overflow: hidden; box-shadow: 0 0 50px rgba(135, 206, 250, 0.5); }
        .click-zone { position: absolute; cursor: pointer; z-index: 50; background: transparent; }
        #main-zone { top: 0%; left: 28%; width: 43%; height: 32%; }
        #b1 { top: 64%; left: 36%; width: 29%; height: 18%; } 
        #b2 { top: 53%; left: -1%; width: 30%; height: 19%; }
        #b3 { top: 53%; left: 71%; width: 29%; height: 18%; }
        #b4 { top: 27%; left: 64%; width: 32%; height: 18%; }
        #b5 { top: 24%; left: 5%; width: 32%; height: 20%; }
        #tree-zone { width: 120px; height: 140px; top: 45%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; z-index: 55; }

        .smoke-puff { position: absolute; width: 20px; height: 20px; background: radial-gradient(circle, rgba(34, 34, 34, 0.6) 30%, rgba(3, 34, 34, 0.6) 100%); border-radius: 50%; pointer-events: none; z-index: 55; opacity: 0; animation: puffAnim 3s infinite ease-out; filter: blur(3px); }
        .smoke-delay-1 { animation-delay: 0.5s; } .smoke-delay-2 { animation-delay: 1.0s; } .smoke-delay-3 { animation-delay: 1.5s; }
        @keyframes puffAnim { 0% { transform: translateY(0) scale(0.5); opacity: 0.7; } 100% { transform: translateY(-30px) scale(2.5); opacity: 0; } }

        .dark-house-overlay { position: absolute; width: 100%; height: 100%; background-size: 100% 100%; background-repeat: no-repeat; background-position: center; transition: opacity 1s ease; pointer-events: none; opacity: 1; z-index: 1; }
        .click-zone.completed .dark-house-overlay { opacity: 0; }
        .click-zone::after { content: '❄️'; font-size: 32px; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); animation: bounce 2s infinite ease-in-out; filter: drop-shadow(0 0 5px #fff); pointer-events: none; transition: opacity 0.5s; z-index: 15; }
        .click-zone.completed::after { opacity: 0; } 
        @keyframes bounce { 0%, 100% { transform: translate(-50%, -10px); } 50% { transform: translate(-50%, -25px); } }
        #main-zone::after { content: '🏆'; font-size: 40px; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); animation: pulseIcon 2s infinite; opacity: 0; transition: opacity 1s; filter: drop-shadow(0 0 10px gold); pointer-events: none; }
        #main-zone.completed::after { opacity: 1; }
        @keyframes pulseIcon { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }

        #hero { position: absolute; width: 90px; height: 90px; background-image: url('img/hero.png'); background-size: contain; background-repeat: no-repeat; background-position: bottom center; top: 93%; left: 50%; transform: translate(-50%, -50%); z-index: 60; transition: top 0.5s linear, left 0.5s linear; filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3)); pointer-events: none; }
        .hero-flip { transform: translate(-50%, -50%) scaleX(-1) !important; }
        .hero-walk { animation: walking 0.3s infinite alternate ease-in-out; }
        @keyframes walking { 0% { transform: translate(-50%, -50%) translateY(0); } 100% { transform: translate(-50%, -50%) translateY(-15px) scale(1.05); } }
        
        #flying-item { position: absolute; width: 40px; height: 40px; background-image: url('img/cert.png'); background-size: contain; background-repeat: no-repeat; display: none; z-index: 70; filter: drop-shadow(0 0 10px gold); pointer-events: none; }

        /* МОДАЛКИ */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 35, 50, 0.8); backdrop-filter: blur(6px); z-index: 40000; justify-content: center; align-items: center; }
        .modal-content { position: relative; background-color: #FFFBF5; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23e0e0e0' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E"); padding: 20px; padding-top: 45px; width: 85%; max-width: 340px; text-align: center; border: 8px solid #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.1); animation: popUp 0.4s ease; }
        .modal-header-ribbon { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: #ff4757; color: white; padding: 8px 30px; border-radius: 8px; font-family: 'Fredoka', sans-serif; font-size: 24px; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4); white-space: nowrap; z-index: 5; }
        .modal-header-ribbon::before { content: ''; position: absolute; top: 10px; left: -10px; border-right: 10px solid #c0392b; border-top: 10px solid transparent; border-bottom: 10px solid transparent; z-index: -1; }
        .modal-header-ribbon::after { content: ''; position: absolute; top: 10px; right: -10px; border-left: 10px solid #c0392b; border-top: 10px solid transparent; border-bottom: 10px solid transparent; z-index: -1; }

        .game-instruction { color: #57606f; font-size: 15px; margin: 10px 0 15px 0; font-weight: 600; line-height: 1.3; background: #dfe6e9; padding: 10px; border-radius: 10px; }
        .close-btn-candy { position: absolute; top: -25px; right: -25px; width: 44px; height: 44px; background: radial-gradient(circle at 30% 30%, #ff6b81, #c0392b); border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; z-index: 10; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 24px; transition: transform 0.2s; }
        .close-btn-candy::before { content: '×'; padding-bottom: 4px; }
        .close-btn-candy:active { transform: scale(0.9); }
        .modal-btn { display: block; width: 100%; padding: 16px; margin-top: 15px; background: #74b9ff; color: #fff; border: none; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-size: 18px; box-shadow: 0 6px 0 #0984e3; cursor: pointer; position: relative; top: 0; transition: 0.1s; }
        .modal-btn:active { top: 6px; box-shadow: 0 0 0 #0984e3; }
        .error-btn { background: #ff7675; box-shadow: 0 6px 0 #d63031; }
        .error-btn:active { box-shadow: 0 0 0 #d63031; }
        .holiday-btn { background: #fdcb6e; color: #634205; box-shadow: 0 6px 0 #e1b12c; }
        .holiday-btn:active { box-shadow: 0 0 0 #e1b12c; }
        .win-gift-btn { 
            background: #6c5ce7; box-shadow: 0 6px 0 #4834d4; 
            animation: pulseBtn 1.5s infinite; 
            transform: translateZ(0); 
            -webkit-font-smoothing: subpixel-antialiased; 
        }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .share-btn { background: #00cec9; box-shadow: 0 6px 0 #00b894; }
        .reset-btn-small { margin-top:10px; background:#b2bec3; box-shadow:0 6px 0 #636e72; color:#fff; font-size:16px; padding: 10px; }

        /* СВЕТЛО-СИНИЙ ФОН ДЛЯ ИГРЫ ЛОВЕЦ */
        #falling-game-area { position: relative; width: 100%; height: 300px; background: #74b9ff; border-radius: 12px; overflow: hidden; margin-bottom: 10px; border: 4px solid #dfe6e9; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); }
        #garland-container { position: absolute; top: 0; left: 0; width: 100%; height: 80px; z-index: 10; pointer-events: none; }
        .garland-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: top center; background-repeat: no-repeat; }
        #garland-on { opacity: 0; transition: opacity 0.1s ease; } 
        .falling-item { position: absolute; width: 85px; height: 85px; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; top: -90px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); z-index: 5; touch-action: none; }
        #catch-score { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: #fff; padding: 5px 10px; border-radius: 10px; font-weight: bold; font-family: 'Fredoka', sans-serif; pointer-events: none; z-index: 20; border: 1px solid rgba(255,255,255,0.3); }
        .boom-text { position: absolute; color: #ff7675; font-size: 28px; font-weight: 900; font-family: 'Fredoka', sans-serif; pointer-events: none; z-index: 50; text-shadow: 2px 2px 0 #fff; animation: boomAnim 0.5s forwards; }
        @keyframes boomAnim { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5) translateY(-20px); opacity: 0; } }

        #ice-game-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .ice-cube { width: 60px; height: 60px; background: linear-gradient(135deg, #e0f7fa 0%, #81ecec 100%); border: 2px solid #fff; border-radius: 12px; color: #0984e3; font-weight: 800; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.2s; font-family: 'Fredoka', sans-serif; }
        .ice-cube.correct { background: #00b894; color: white; border-color: #55efc4; pointer-events: none; transform: scale(1.1); }
        .ice-cube:active { transform: scale(0.95); }
        #ice-target-word { font-size: 22px; font-weight: bold; color: #2d3436; margin-bottom: 10px; font-family: 'Fredoka', sans-serif; }

        #memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }

            const m=document.getElementById('modal'), i=document.getElementById('modal-inner'), d=quizData[id]; i.innerHTML=""; 
            let descHtml = `<div class="game-instruction">${d.desc}</div>`;
            if(d.type==="battle"){ battleIndex=0; i.innerHTML=`<div class="modal-header-ribbon">Битва</div>${descHtml}<div style="margin-top:10px" id="battle-area"></div>`; showBattleRound(id); }
            else if(d.type==="falling"){ fallingScore=0; fallingSpeed=1000; i.innerHTML=`<div class="modal-header-ribbon">Гирлянда</div>${descHtml}<div id="falling-game-area"><div id="catch-score">0/20</div><div id="garland-container"><img src="img/garland_off.png" class="garland-layer" id="garland-off"><img src="img/garland_on.png" class="garland-layer" id="garland-on"></div></div><button class="modal-btn error-btn" onclick="stopFallingGame()">Хватит ловить ❄️</button>`; startFallingGame(id); } 
            else if(d.type==="puzzle"){ i.innerHTML=`<div class="modal-header-ribbon">Пазл</div>${descHtml}<div id="puzzle-area"></div><button class="modal-btn error-btn" onclick="closeModal()">Выйти</button>`; initPuzzle(id); }
            else if(d.type==="memory"){ i.innerHTML=`<div class="modal-header-ribbon">Пары</div>${descHtml}<div id="memory-grid"></div><button class="modal-btn error-btn" onclick="closeModal()">Выйти</button>`; initMemory(id); }
            else if(d.type==="iceCode"){ iceRound = 0; i.innerHTML=`<div class="modal-header-ribbon">Код</div>${descHtml}<div id="ice-target-word"></div><div id="ice-game-area"></div>`; startIceGame(id); } 
            m.style.display="flex"; 
        }
        function closeModal() { clearInterval(fallingInterval); document.getElementById('modal').style.display='none'; }
        
        function showBattleRound(id){
            if(battleIndex>=battleRounds.length){winGame(id);return;}
            const r=battleRounds[battleIndex];
            const a=document.getElementById('battle-area');
            const s=Math.random()<0.5;
            a.innerHTML=`
                <p style="font-size:18px; font-weight:bold;">${r.q}</p>
                <div class="battle-card" id="card-1" onclick="checkBattle(this, '${s?"good":"bad"}', ${id}, '${r.info}')">${s?r.good:r.bad}</div>
                <div class="battle-card" id="card-2" onclick="checkBattle(this, '${s?"bad":"good"}', ${id}, '${r.info}')">${s?r.bad:r.good}</div>
                <div class="battle-feedback-container" id="battle-feedback-ui">
                    <div class="battle-info-text" id="battle-info-text"></div>
                    <button class="battle-next-btn" onclick="nextBattleRound(${id})">Далее ➡</button>
                </div>
            `;
        } 

        function checkBattle(el, type, id, info) {
            if(document.getElementById('battle-feedback-ui').style.display === 'block') return;
            const cards = document.querySelectorAll('.battle-card');
            cards.forEach(c => c.classList.add('disabled')); 
            if (type === "good") {
                el.style.background = "#dff9fb"; el.style.border = "2px solid #00b894"; el.style.color = "#00b894";
                playSound('sfx-win');
                document.getElementById('battle-info-text').innerText = "✅ Верно! " + info;
                document.getElementById('battle-feedback-ui').style.display = 'block';
            } else {
                el.style.background = "#fab1a0"; el.style.border = "2px solid #d63031";
                setTimeout(() => { closeModal(); loseLife(); }, 500);
            }
        }

        function nextBattleRound(id) { battleIndex++; showBattleRound(id); }
        function startFallingGame(id){const a=document.getElementById('falling-game-area');fallingInterval=setInterval(()=>sF(a,id),fallingSpeed);} 
        function sF(a,id){
            if(document.getElementById('modal').style.display==='none'){ clearInterval(fallingInterval); return; }
            const i=document.createElement('div'); i.className='falling-item';
            const isBad = Math.random() < 0.3;
            const goodImgs = ['img/good1.png', 'img/good2.png', 'img/good3.png', 'img/good4.png', 'img/good5.png', 'img/good6.png', 'img/good7.png', 'img/good8.png'];
            const badImgs = ['img/bad1.png', 'img/bad2.png'];
            i.style.backgroundImage = `url('${isBad ? badImgs[Math.floor(Math.random()*badImgs.length)] : goodImgs[Math.floor(Math.random()*goodImgs.length)]}')`;
            const maxX = a.clientWidth - 85; i.style.left = Math.random() * maxX + 'px';
            i.onmousedown = i.ontouchstart = (e) => { e.preventDefault(); 
                if(isBad){ 
                    showBoom(e.target.offsetLeft, e.target.offsetTop, a); 
                    clearInterval(i.dataset.t); i.remove(); fallingScore=0; fallingSpeed=1000; updateCatchUI(); 
                }
                else { clearInterval(i.dataset.t); i.remove(); fallingScore++; updateCatchUI(); playSound('sfx-win'); if(fallingSpeed > 300) fallingSpeed -= 30; clearInterval(fallingInterval); fallingInterval = setInterval(()=>sF(a,id), fallingSpeed); if(fallingScore >= TARGET_SCORE){ stopFallingGame(); winGame(id); } }
            };
            a.appendChild(i); let p = -90; const s = 3 + (fallingScore * 0.3);
            const t = setInterval(() => { if(document.getElementById('modal').style.display==='none'){ clearInterval(t); return; } p += s; i.style.top = p + 'px'; if(p > 300) { clearInterval(t); if(i.parentNode) i.remove(); } }, 20); i.dataset.t = t;
        } 
        function updateCatchUI() { document.getElementById('catch-score').innerText = fallingScore + '/20'; const pct = Math.pow(fallingScore / TARGET_SCORE, 0.6); document.getElementById('garland-on').style.opacity = pct; }
        
        function showBoom(x, y, container) { 
            playSound('sfx-error'); 
            const boom = document.createElement('div'); boom.className = 'boom-text'; boom.innerText = 'БАХ!'; boom.style.left = (x + 10) + 'px'; boom.style.top = (y + 10) + 'px'; container.appendChild(boom); setTimeout(() => boom.remove(), 500); tg.HapticFeedback.notificationOccurred('error'); 
        }
        
        function stopFallingGame(){clearInterval(fallingInterval);const items=document.querySelectorAll('.falling-item');items.forEach(i=>i.remove());closeModal();}

        function startIceGame(id) {
            const round = iceLevels[Math.floor(Math.random() * iceLevels.length)]; currentIceWord = round.a; 
            document.getElementById('ice-target-word').innerHTML = `Раунд ${iceRound+1}/${ICE_ROUNDS}<br>${round.q}`; 
            iceIndex = 0; let chars = currentIceWord.split('').map((char, i) => ({ char, id: i })); chars.sort(() => Math.random() - 0.5);
            const area = document.getElementById('ice-game-area'); area.innerHTML = '';
            chars.forEach(item => {
                let btn = document.createElement('div'); btn.className = 'ice-cube'; btn.innerText = item.char;
                btn.onclick = () => {
                    if (item.char === currentIceWord[iceIndex]) {
                        btn.classList.add('correct'); iceIndex++; playSound('sfx-win');
                        if (iceIndex === currentIceWord.length) { setTimeout(() => { iceRound++; if(iceRound >= ICE_ROUNDS) winGame(id); else startIceGame(id); }, 500); }
                    } else { tg.HapticFeedback.notificationOccurred('error'); btn.style.background = '#ff7675'; setTimeout(() => btn.style.background = '', 300); }
                };
                area.appendChild(btn);
            });
        }

        function initPuzzle(id){puzzleState=[0,1,2,3,4,5,6,7,8];let e=8;for(let i=0;i<100;i++){let n=getN(e),r=n[Math.floor(Math.random()*n.length)];[puzzleState[e],puzzleState[r]]=[puzzleState[r],puzzleState[e]];e=r;}renderPuzzle(id);} function getN(i){const n=[];const r=Math.floor(i/3),c=i%3;if(r>0)n.push(i-3);if(r<2)n.push(i+3);if(c>0)n.push(i-1);if(c<2)n.push(i+1);return n;} 
        function renderPuzzle(id){
            const el=document.getElementById('puzzle-area');el.innerHTML='';
            puzzleState.forEach((v,i)=>{
                if(v===8)return; let t=document.createElement('div'); t.className='puzzle-tile'; t.style.top=Math.floor(i/3)*80+'px';t.style.left=(i%3)*80+'px'; t.style.backgroundImage=`url('${PUZZLE_IMAGE_URL}')`; t.style.backgroundPosition=`-${(v%3)*80}px -${Math.floor(v/3)*80}px`;
                t.onclick=()=>mT(i,id);el.appendChild(t);
            });
        } 
        function mT(i,id){ let e=puzzleState.indexOf(8),n=getN(i); if(n.includes(e)){ [puzzleState[i],puzzleState[e]]=[puzzleState[e],puzzleState[i]]; playSound('sfx-step'); renderPuzzle(id); if(puzzleState.every((v,k)=>v===k)) { document.getElementById('modal-inner').innerHTML = `<div class="modal-header-ribbon">Ура!</div><div style="font-size:50px; margin: 20px 0;">🧩</div><h2 style="color:#2d3436;">Собрано!</h2><button class="modal-btn error-btn" onclick="winGame(${id})">Отлично!</button>`; playSound('sfx-win'); } } }

        function initMemory(id){matchedCount=0;flippedCards=[];let c=[];memoryPairs.forEach(p=>{c.push({v:p.name,id:p.name});c.push({v:p.t,id:p.name});});c.sort(()=>Math.random()-0.5);const g=document.getElementById('memory-grid');g.innerHTML="";c.forEach(x=>{let d=document.createElement('div');d.className='mem-card';d.innerText=x.v;d.dataset.pid=x.id;d.onclick=()=>{if(flippedCards.length>=2||d.classList.contains('flipped'))return;d.classList.add('flipped');flippedCards.push(d);if(flippedCards.length===2){let c1=flippedCards[0],c2=flippedCards[1];if(c1.dataset.pid===c2.dataset.pid){ playSound('sfx-win'); setTimeout(()=>{c1.classList.add('matched');c2.classList.add('matched');flippedCards=[];matchedCount++;if(matchedCount===3)winGame(id);},500);}else{ setTimeout(()=>{c1.classList.remove('flipped');c2.classList.remove('flipped');flippedCards=[];},1000);}}};g.appendChild(d);});}
        
        function winGame(id) { closeModal(); tg.HapticFeedback.notificationOccurred('success'); document.getElementById('b'+id).classList.add('completed'); playSound('sfx-win'); animateCertificate(id); }
        function animateCertificate(id){
            const h=document.getElementById('b'+id)||document.getElementById('main-zone'),f=document.getElementById('flying-item'),r=h.getBoundingClientRect(),t=document.getElementById('mini-'+id).getBoundingClientRect();
            f.style.display='block';f.style.transition='none';f.style.top=r.top+'px';f.style.left=r.left+'px';
            setTimeout(()=>{f.style.transition='0.8s';f.style.top=t.top+'px';f.style.left=t.left+'px';f.style.transform='scale(0.5)';},50);
            setTimeout(()=>{
                f.style.display='none';f.style.transform='scale(1)';
                document.getElementById('mini-'+id).classList.add('collected');
                completedHouses.add(id);
                saveProgress(); 
                if (completedHouses.size === 5) { document.getElementById('main-zone').classList.add('completed'); }
            },850);
        }
        
        function loseLife(){lives--;updateLivesUI();if(lives<=0){document.getElementById('modal-inner').innerHTML=`<div class="modal-header-ribbon">Упс...</div><h1 style="margin-top:20px">💔</h1><button class="modal-btn error-btn" onclick="location.reload()">Заново</button>`;document.getElementById('modal').style.display='flex';}else{document.getElementById('modal-inner').innerHTML=`<div class="modal-header-ribbon">Ошибка</div><h2 style="color:#c0392b; margin-top:20px">Неверно!</h2><button class="modal-btn" onclick="closeModal()">OK</button>`;document.getElementById('modal').style.display='flex';}tg.HapticFeedback.notificationOccurred('error');}
        function updateLivesUI(){const c=document.getElementById('lives-container'); if(c) {c.innerHTML='';for(let i=0;i<lives;i++){const h=document.createElement('div');h.className='life-icon';c.appendChild(h);}}}
    </script>
</body>
</html>
